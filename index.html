<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restores a deep link redirected by 404.html (GitHub Pages SPA fallback).
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>SnackGlobe — Where every snack tells a story</title>
    <meta
      name="description"
      content="Explore traditional snacks and beverages from around the world through an interactive map, immersive cultural stories, and adaptable recipes."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
