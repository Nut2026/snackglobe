<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnackGlobe</title>
    <script>
      // GitHub Pages has no server rewrites, so unknown paths land here.
      // Re-encode the requested path into a query string and hand back to index.html,
      // which decodes it and lets React Router resolve the route.
      var pathSegmentsToKeep = 1; // 1 = project site at /<repo>/
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
